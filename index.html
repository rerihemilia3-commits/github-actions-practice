<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой веб-проект</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Мой первый веб-проект</h1>
        <p>Автоматическая проверка сайта с GitHub Actions</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Добро пожаловать!</h2>
            <p>
                Это учебный веб-проект, созданный для изучения
                автоматизации проверки кода.
            </p>
            <button id="checkButton">Проверить проект</button>
            <p id="result">Нажмите на кнопку.</p>
        </section>
    </main>

    <footer>
        <p>Практическая работа | GitHub Actions</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
